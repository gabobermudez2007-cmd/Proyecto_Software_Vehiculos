spring.application.name=flota-backend
server.port=8080

# Base de datos: se puede sobrescribir con variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flota_db?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.cargar-datos-prueba=${CARGAR_DATOS_PRUEBA:true}